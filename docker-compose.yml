services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: microfinance
      POSTGRES_USER: microfinance
      POSTGRES_PASSWORD: microfinance_password_change_me
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./app:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://microfinance:microfinance_password_change_me@db:5432/microfinance
    depends_on:
      - db
    command: bash -lc "pip install --no-cache-dir django psycopg[binary] dj-database-url python-dateutil && if [ ! -f manage.py ]; then django-admin startproject core .; fi && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

volumes:
  pgdata:
